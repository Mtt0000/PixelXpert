name: Build and Release Minimal

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Grant execute permission for build_minimal.sh
      run: chmod +x build_minimal.sh

    - name: Run build script
      run: ./build_minimal.sh

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelXpert-Minimal-APK
        path: PixelXpert-Minimal.apk

    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: PixelXpert-Minimal-ZIP
        path: PixelXpert-Minimal.zip

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          PixelXpert-Minimal.apk
          PixelXpert-Minimal.zip
        name: Auto-build Release ${{ github.sha }}
        tag_name: build-${{ github.run_id }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
